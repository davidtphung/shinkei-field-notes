:2rem;padding:3rem 6vw;border-top:1px solid #334448;color:#c2d1cf;font-size:.64rem;font-weight:bold;letter-spacing:.14em}@media(max-width:700px){.nav{padding:0 1rem}.intro{display:block;padding:5rem 1.5rem}.intro h1{font-size:clamp(5rem,25vw,9rem);margin:3rem 0}.stage{padding:3rem 1rem 4rem}.page{box-shadow:8px 8px 0 #ef411a}.page img{max-height:none}.controls{grid-template-columns:1fr 1fr}.dots{grid-column:1/-1;grid-row:2;justify-content:center}.foot{display:block;padding:2rem 1.5rem;line-height:2}}</style></head><body><header class="nav"><b class="brand">SHINKEI®</b><a class="download" href="assets/six-seconds-field-brief.pdf" download>DOWNLOAD PDF ↓</a></header><main><section class="intro"><p class="eyebrow">INTERACTIVE READER</p><h1>SIX<br>SECONDS.</h1><p>Stories from the boats and the factory floor. Explore the field brief one spread at a time.</p></section><section class="stage"><div class="meta"><span id="num">COVER / 01</span><span id="title">Six seconds.</span></div><div class="page"><img id="spread" src="assets/page-1.jpg" alt="Page 1: Six seconds."></div><p class="caption" id="caption">Stories from the boats and the factory floor.</p><div class="controls"><button id="prev" aria-label="Previous page">← PREVIOUS</button><div class="dots" id="dots"></div><button id="next" aria-label="Next page">NEXT →</button></div></section></main><footer class="foot"><span>USE THE ARROW KEYS TO NAVIGATE.</span><a class="back" href="../">BACK TO FIELD NOTES ↑</a></footer><script>const p=[['COVER','Six seconds.','Stories from the boats and the factory floor.'],['00','Read this before the stories.','A compact field guide to ike jime, the tools, and the sequence.'],['01','Surgery, at sea, in six seconds.','The engineers building delicate systems for brutal conditions.'],['02','The boat is the product.','Three fishermen, three coasts, and the value of every catch.'],['PSDN-S','The machine.','One cycle, drawn to scale.'],['03','The factory floor.','The people and production behind the system.'],['04','The record follows the fish.','A closer look at the signal from deck to plate.']];let i=0;const img=document.querySelector('#spread'),n=document.querySelector('#num'),t=document.querySelector('#title'),c=document.querySelector('#caption'),prev=document.querySelector('#prev'),next=document.querySelector('#next'),dots=document.querySelector('#dots');p.forEach((x,j)=>{const b=document.createElement('button');b.textContent=String(j+1).padStart(2,'0');b.onclick=()=>go(j);dots.appendChild(b)});function go(j){i=j;img.src=`assets/page-${i+1}.jpg`;img.alt=`Page ${i+1}: ${p[i][1]}`;n.textContent=`${p[i][0]} / ${String(i+1).padStart(2,'0')}`;t.textContent=p[i][1];c.textContent=p[i][2];prev.disabled=i===0;next.disabled=i===p.length-1;[...dots.children].forEach((b,k)=>b.className=k===i?'active':'')}prev.onclick=()=>go(Math.max(0,i-1));next.onclick=()=>go(Math.min(p.length-1,i+1));document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')prev.click();if(e.key==='ArrowRight')next.click()});go(0);</script></body></html>
